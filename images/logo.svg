<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#006b38"/>
    </linearGradient>
    <linearGradient id="bladeGradL" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#005a2e"/>
    </linearGradient>
    <linearGradient id="bladeGradR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00cc6a"/>
      <stop offset="100%" stop-color="#005a2e"/>
    </linearGradient>
  </defs>

  <!-- Central blade — pointing up -->
  <polygon points="300,40 340,220 320,400 300,420 280,400 260,220" fill="url(#bladeGrad)"/>
  <!-- Central blade spine -->
  <line x1="300" y1="60" x2="300" y2="400" stroke="#003d1f" stroke-width="2" opacity="0.5"/>

  <!-- Left blade — angled down-left -->
  <polygon points="130,480 180,320 280,380 290,400 270,420 140,500" fill="url(#bladeGradL)"/>
  <!-- Left blade spine -->
  <line x1="155" y1="400" x2="280" y2="390" stroke="#003d1f" stroke-width="2" opacity="0.5"/>

  <!-- Right blade — angled down-right -->
  <polygon points="470,480 420,320 320,380 310,400 330,420 460,500" fill="url(#bladeGradR)"/>
  <!-- Right blade spine -->
  <line x1="445" y1="400" x2="320" y2="390" stroke="#003d1f" stroke-width="2" opacity="0.5"/>

  <!-- Center circle — hub -->
  <circle cx="300" cy="390" r="30" fill="#0a0f0a" stroke="#00cc6a" stroke-width="3"/>
  <circle cx="300" cy="390" r="14" fill="#00cc6a" opacity="0.7"/>

  <!-- Outer ring accent -->
  <circle cx="300" cy="390" r="55" fill="none" stroke="#00cc6a" stroke-width="1.5" opacity="0.3"/>

  <!-- QIn text -->
  <text x="300" y="600" text-anchor="middle"
        font-family="'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif"
        font-size="80" font-weight="700" letter-spacing="16"
        fill="#00cc6a">QIn</text>

  <!-- Thin underline accent -->
  <line x1="180" y1="620" x2="420" y2="620" stroke="#00cc6a" stroke-width="2" opacity="0.5"/>
</svg>
